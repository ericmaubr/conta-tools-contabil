# Config de DESENVOLVIMENTO apenas — usado por `alembic revision --autogenerate`
# ao criar uma migração nova. Em produção/deploy, as migrações são aplicadas
# via `python -m conta_tools_contabil migrar`, que lê os scripts empacotados em
# `src/conta_tools_contabil/alembic/` — ver `src/conta_tools_contabil/migrations.py`.

[alembic]
script_location = %(here)s/src/conta_tools_contabil/alembic
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
