host = 127.0.0.1
port = 5016
; prefixo do Caddy (handle_path /contabil/*); vazio em dev
root_path =

[db]
; produção: postgresql+psycopg://conta_tools_contabil_app:<senha>@localhost:5432/conta_tools_contabil
