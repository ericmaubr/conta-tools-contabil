[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conta-tools-contabil"
version = "0.1.3"
description = "Conciliação contábil a partir das exportações do IGC (razão, balancete, plano de contas)"
requires-python = ">=3.11"
authors = [{ name = "Eric Mauricio" }]
dependencies = [
    "conta-tools-shared>=0.16.9",
    "psycopg[binary]>=3.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "httpx>=0.27",
    "ruff>=0.4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
conta_tools_contabil = [
    "api/static/*",
    "alembic/env.py",
    "alembic/script.py.mako",
    "alembic/versions/*.py",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# linhas de teste reproduzem linhas do IGC (8 células); quebrar só piora a leitura
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto"
python_files = ["test_*.py"]
